<body>
  <p>머리말
이 '리베러스의 역사'를 정리하려 한지 오래됐지만 생각만 했을 뿐 실제로 행동에 옮기지는 않았다. 그러나 점차 사라져가는 기억과 시간의 앞뒤가 햇갈리는 걸 느끼고는 우리의 역사를 정리하게 되었다. 거의 5년간 함께해 그런지 사건도 많았고 사건도 많았다. 우리가 역사를 배우는 이유는 과거의 실수를 되풀이하지 않기 위해서이다. 부디 여기 있던 나쁜 일은 반면교사로 삼아 성장하길 바란다.
</p>
